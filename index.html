<!DOCTYPE html>
<html>
  <head>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

      type="text/css"
      rel="stylesheet"

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto Notas</title>
    <style type="text/css">

            <th>Nota 1</th>
            <th>Nota 2</th>

            <th>Nota 4</th>

        <tbody id="tbody"></tbody>

    </div>
    <script src="js/dadosAlunos.js"></script>
